name: release
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: version
        run: |
          tag="${GITHUB_REF_NAME}"
          [ "$(sh install.sh version)" = "$tag" ] || { echo "::error::install.sh says $(sh install.sh version), the tag $tag"; exit 1; }
          grep -q "^\$InstallerVersion = '$tag'$" install.ps1 || { echo "::error::install.ps1 does not say $tag"; exit 1; }
      - name: sums
        run: sha256sum install.sh install.ps1 > SHA256SUMS
      - name: publish
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
              --notes "The installer $GITHUB_REF_NAME." install.sh install.ps1 SHA256SUMS
